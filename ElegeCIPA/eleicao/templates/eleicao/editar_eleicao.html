{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Eleição - Eleições CIPA{% endblock %}

{% block content %}
<section class="pt-32 min-h-[100vh] px-6 py-12 bg-gray-50">

    <!-- Título principal -->
    <h1 class="text-3xl font-bold text-[#004876] text-center mb-8 flex items-center justify-center gap-2">
        <i class="fas fa-edit text-[#ffa400]"></i> Editar Eleição
    </h1>

    <!-- Formulário de edição da eleição -->
    <form method="post" class="max-w-md mx-auto space-y-6 bg-white rounded-2xl shadow-lg p-8">
        {% csrf_token %}

        <!-- Data de Início -->
        <div class="flex flex-col">
            <label for="data_inicio" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> Data de Início
            </label>
            <input type="date" id="data_inicio" name="data_inicio" required
                value="{{ eleicao.data_inicio|date:'Y-m-d' }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
        </div>

        <!-- Data de Fim -->
        <div class="flex flex-col">
            <label for="data_fim" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> Data de Fim
            </label>
            <input type="date" id="data_fim" name="data_fim" required
                value="{{ eleicao.data_fim|date:'Y-m-d' }}"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
        </div>

        <!-- Eleição Vigente -->
        <div class="flex items-center p-4 border border-gray-300 rounded-xl bg-gray-50">
            <input type="checkbox" id="vigente" name="vigente" {% if eleicao.vigente %}checked{% endif %} 
                class="w-5 h-5 text-[#004876] bg-gray-100 border-gray-300 rounded focus:ring-[#004876] focus:ring-2">
            <label for="vigente" class="ml-3 text-gray-700 font-medium cursor-pointer">
                Eleição Vigente
            </label>
        </div>
        <p class="text-sm text-gray-500 -mt-4">
            Marque esta opção para tornar esta a eleição ativa no sistema
        </p>

        <!-- Botões -->
        <div class="flex flex-col sm:flex-row gap-4 mt-6">
            <!-- Botão Cancelar -->
            <a href="{% url 'painel_admin' %}"
                class="flex-1 px-6 py-3 rounded-full bg-gray-500 text-white font-semibold hover:bg-gray-600 transition flex items-center justify-center gap-2 text-center">
                <i class="fas fa-times"></i> Cancelar
            </a>

            <!-- Botão Salvar -->
            <button type="submit"
                class="flex-1 px-6 py-3 rounded-full bg-[#004876] text-white font-semibold hover:bg-[#ffa400] transition flex items-center justify-center gap-2">
                <i class="fas fa-save"></i> Salvar
            </button>
        </div>

    </form>

</section>
{% endblock %}
