{% extends 'base.html' %}
{% block title %}Encerrar Eleição - Eleições CIPA{% endblock %}

{% block content %}

<section class="pt-32 min-h-[100vh] px-6 py-12 bg-gray-50">

    <h1 class="text-3xl font-bold text-[#004876] text-center mb-8 flex items-center justify-center gap-2">
        <i class="fas fa-ban text-[#ffa400]"></i> Encerrar Eleição
    </h1>

    {% if eleicoes_ativas %}
    <form method="post" class="max-w-md mx-auto space-y-6 bg-white rounded-2xl shadow-lg p-8">
        {% csrf_token %}

        <div class="flex flex-col">
            <label for="eleicao_id" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                <i class="fas fa-list"></i> Escolha a Eleição
            </label>
            <select id="eleicao_id" name="eleicao_id" required
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
                {% for e in eleicoes_ativas %}
                <option value="{{ e.id }}">Eleição {{ e.id }} - {{ e.data_inicio|date:"d/m/Y" }} até {{ e.data_fim|date:"d/m/Y" }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="text-center">
            <button type="submit"
                class="mt-4 px-6 py-3 rounded-full bg-[#004876] text-white font-semibold hover:bg-[#ffa400] transition flex items-center justify-center gap-2 w-full">
                <i class="fas fa-save"></i> Confirmar
            </button>
        </div>

        <div class="text-center">
            <a href="{% url 'painel_admin' %}"
                class="mt-2 px-6 py-3 rounded-full bg-gray-300 text-gray-700 font-semibold hover:bg-gray-400 transition flex items-center justify-center gap-2 w-full">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>
    </form>
    {% else %}
    <p class="text-center text-gray-600">Não há eleições em andamento para encerrar.</p>
    {% endif %}

    <!-- Botão Voltar ao Painel -->
    <div class="pt-20 flex justify-center mt-6">
        <a href="{% url 'painel_admin' %}" 
        class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-full bg-[#004876] text-white font-medium hover:bg-[#ffa400] transition text-sm">
            <i class="fas fa-arrow-left"></i> Voltar ao Painel
        </a>
    </div>

</section>
{% endblock %}
