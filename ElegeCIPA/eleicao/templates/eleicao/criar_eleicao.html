{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Eleição - Eleições CIPA{% endblock %}

{% block content %}

{% if alert_msg %}
<script>
    alert("{{ alert_msg|escapejs }}");
    // Redireciona para o painel após o alert
    window.location.href = "{% url 'painel_admin' %}";
</script>
{% endif %}

<section class="pt-32 min-h-[100vh] px-6 py-12 bg-gray-50">

    <!-- Título principal -->
    <h1 class="text-3xl font-bold text-[#004876] text-center mb-8 flex items-center justify-center gap-2">
        <i class="fas fa-plus-circle text-[#ffa400]"></i> Criar Eleição
    </h1>

    <!-- Formulário de criação da eleição -->
    <form method="post" class="max-w-md mx-auto space-y-6 bg-white rounded-2xl shadow-lg p-8">
        {% csrf_token %}

        <!-- Data de Início -->
        <div class="flex flex-col">
            <label for="data_inicio" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> Data de Início
            </label>
            <input type="date" id="data_inicio" name="data_inicio" required
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
        </div>

        <!-- Data de Fim -->
        <div class="flex flex-col">
            <label for="data_fim" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> Data de Fim
            </label>
            <input type="date" id="data_fim" name="data_fim" required
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
        </div>

        <!-- Botão para salvar eleição -->
        <div class="text-center">
            <button type="submit"
                class="mt-4 px-6 py-3 rounded-full bg-[#004876] text-white font-semibold hover:bg-[#ffa400] transition flex items-center justify-center gap-2 w-full">
                <i class="fas fa-save"></i> Salvar Eleição
            </button>
        </div>

        <!-- Botão Cancelar -->
        <div class="text-center">
            <a href="{% url 'painel_admin' %}"
                class="mt-2 px-6 py-3 rounded-full bg-gray-300 text-gray-700 font-semibold hover:bg-gray-400 transition flex items-center justify-center gap-2 w-full">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>

    </form>

</section>
{% endblock %}
