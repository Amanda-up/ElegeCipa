{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Candidato - Eleições CIPA{% endblock %}

{% block content %}
<section class="pt-32 min-h-[100vh] px-6 py-12 bg-gray-50">

    <h1 class="text-3xl font-bold text-[#004876] text-center mb-8 flex items-center justify-center gap-2">
        <i class="fas fa-edit text-[#ffa400]"></i> Editar Candidato
    </h1>

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Foto -->
            <div class="flex flex-col">
                <label class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-image"></i> Foto
                </label>
                <div class="relative">
                    <input type="file" id="foto" name="foto" accept="image/*" class="hidden"
                        onchange="updateFileName(this)">
                    <button type="button" onclick="document.getElementById('foto').click()"
                        class="w-full px-4 py-2 border border-gray-300 rounded-xl bg-white text-gray-700 hover:bg-gray-100 transition flex items-center justify-between">
                        <span id="fileName" class="block w-full truncate">
                            {{ candidato.foto.name|default:"Selecionar arquivo" }}
                        </span>
                        <i class="fas fa-upload text-gray-500 ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Nome Completo -->
            <div class="flex flex-col">
                <label for="nome_completo" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-id-card"></i> Nome Completo
                </label>
                <input type="text" id="nome_completo" name="nome_completo" required
                    value="{{ candidato.nome_completo }}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
            </div>

            <!-- Cargo -->
            <div class="flex flex-col">
                <label for="cargo" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-briefcase"></i> Cargo
                </label>
                <input type="text" id="cargo" name="cargo" required value="{{ candidato.cargo }}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
            </div>

            <!-- Setor -->
            <div class="flex flex-col">
                <label for="setor" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-building"></i> Setor
                </label>
                <input type="text" id="setor" name="setor" required value="{{ candidato.setor }}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
            </div>

            <!-- Unidade -->
            <div class="flex flex-col">
                <label for="unidade" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-hospital"></i> Unidade
                </label>
                <select id="unidade" name="unidade" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
                    <option value="">Selecione uma unidade</option>
                    <option value="HE" {% if candidato.unidade == "HE" %}selected{% endif %}>HE (filiais 1, 2 e 7: HE, CORP e LAB)</option>
                    <option value="CNBH" {% if candidato.unidade == "CNBH" %}selected{% endif %}>CNBH</option>
                    <option value="CNVN" {% if candidato.unidade == "CNVN" %}selected{% endif %}>CNVN</option>
                    <option value="CNCT" {% if candidato.unidade == "CNCT" %}selected{% endif %}>CNCT</option>
                    <option value="CESP" {% if candidato.unidade == "CESP" %}selected{% endif %}>CESP</option>
                </select>
            </div>

            <!-- Eleição -->
            <div class="flex flex-col">
                <label for="eleicao" class="text-gray-700 font-medium mb-2 flex items-center gap-2">
                    <i class="fas fa-calendar-check"></i> Eleição
                </label>
                <select id="eleicao" name="eleicao_id" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#004876]">
                    <option value="">Selecione a eleição</option>
                    {% for eleicao in eleicoes %}
                    <option value="{{ eleicao.id }}" {% if candidato.eleicao.id == eleicao.id %}selected{% endif %}>
                        {{ eleicao.get_unidade_display }} — Eleição {{ eleicao.id }}: {{ eleicao.data_inicio|date:"d/m/Y" }} até {{ eleicao.data_fim|date:"d/m/Y" }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Botão Salvar -->
            <div class="text-center">
                <button type="submit"
                    class="mt-4 px-6 py-3 rounded-full bg-[#004876] text-white font-semibold hover:bg-[#ffa400] transition flex items-center justify-center gap-2 w-full">
                    <i class="fas fa-save"></i> Salvar Alterações
                </button>
            </div>

        </form>

        <!-- Botão Cancelar -->
        <div class="text-center mt-4">
            <a href="{% url 'painel_admin' %}"
                class="px-6 py-3 rounded-full bg-gray-300 text-gray-700 font-semibold hover:bg-gray-400 transition flex items-center justify-center gap-2 w-full">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>

    </div>

</section>

<script>
    function updateFileName(input) {
        const fileName = input.files.length > 0 ? input.files[0].name : "Selecionar arquivo";
        document.getElementById('fileName').textContent = fileName;
    }
</script>
{% endblock %}
